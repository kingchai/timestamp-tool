<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时间戳转换工具</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d28;
    --card-hover: #222636;
    --border: #2a2e3d;
    --text: #e4e6ed;
    --text-dim: #8b8fa3;
    --accent: #5b8def;
    --accent-hover: #4a7de0;
    --green: #4ec9b0;
    --orange: #e0a857;
    --red: #e06c75;
    --radius: 10px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px;
  }

  .container {
    max-width: 820px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 32px;
  }

  header h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  header p {
    color: var(--text-dim);
    font-size: 14px;
    margin-top: 6px;
  }

  /* —— 实时时间卡片 —— */
  .live-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    margin-bottom: 24px;
  }

  .live-time {
    font-size: 42px;
    font-weight: 700;
    font-family: "SF Mono", "Fira Code", monospace;
    text-align: center;
    letter-spacing: 2px;
    color: var(--accent);
    margin-bottom: 20px;
  }

  .live-date {
    text-align: center;
    color: var(--text-dim);
    font-size: 15px;
    margin-bottom: 24px;
  }

  .ts-row {
    display: flex;
    gap: 16px;
  }

  .ts-box {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    text-align: center;
    transition: border-color 0.2s;
  }

  .ts-box:hover { border-color: var(--accent); }

  .ts-box .label {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .ts-box .value {
    font-size: 20px;
    font-family: "SF Mono", "Fira Code", monospace;
    font-weight: 600;
    color: var(--green);
    cursor: pointer;
    position: relative;
  }

  .ts-box .value:hover { color: var(--orange); }

  .ts-box .copy-hint {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 6px;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .ts-box:hover .copy-hint { opacity: 1; }

  /* —— 转换工具卡片 —— */
  .convert-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 24px;
  }

  .convert-card h2 {
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .convert-card h2 .icon {
    width: 6px;
    height: 18px;
    border-radius: 3px;
    background: var(--accent);
  }

  .input-group {
    display: flex;
    gap: 12px;
    margin-bottom: 14px;
  }

  .input-group input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    color: var(--text);
    font-size: 15px;
    font-family: "SF Mono", "Fira Code", monospace;
    outline: none;
    transition: border-color 0.2s;
  }

  .input-group input:focus { border-color: var(--accent); }

  .input-group input::placeholder { color: var(--text-dim); }

  .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px 24px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
  }

  .btn:hover { background: var(--accent-hover); }

  .btn-secondary {
    background: var(--card-hover);
    border: 1px solid var(--border);
  }

  .btn-secondary:hover { background: var(--border); }

  .result-area {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    min-height: 56px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .result-line {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 14px;
  }

  .result-line .r-label {
    color: var(--text-dim);
    min-width: 90px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .result-line .r-value {
    font-family: "SF Mono", "Fira Code", monospace;
    font-size: 15px;
    color: var(--green);
    cursor: pointer;
  }

  .result-line .r-value:hover { color: var(--orange); }

  .result-empty {
    color: var(--text-dim);
    font-size: 14px;
    text-align: center;
    line-height: 24px;
  }

  /* —— 快捷按钮 —— */
  .quick-btns {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  .quick-btn {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 13px;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.2s;
  }

  .quick-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* —— Toast —— */
  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--accent);
    color: #fff;
    padding: 10px 24px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    opacity: 0;
    transition: all 0.3s;
    z-index: 999;
    pointer-events: none;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  footer {
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    margin-top: 32px;
    padding-bottom: 16px;
  }

  @media (max-width: 600px) {
    .ts-row { flex-direction: column; }
    .live-time { font-size: 32px; }
    .input-group { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🕐 时间戳转换工具</h1>
    <p>本地时间 · 秒级时间戳 · 毫秒级时间戳 · 双向转换</p>
  </header>

  <!-- 实时时间 -->
  <div class="live-card">
    <div class="live-time" id="liveTime">--:--:--</div>
    <div class="live-date" id="liveDate">----年--月--日 星期-</div>
    <div class="ts-row">
      <div class="ts-box">
        <div class="label">秒级时间戳 (10位)</div>
        <div class="value" id="tsSeconds" onclick="copyText(this.innerText)">0</div>
        <div class="copy-hint">点击复制</div>
      </div>
      <div class="ts-box">
        <div class="label">毫秒级时间戳 (13位)</div>
        <div class="value" id="tsMillis" onclick="copyText(this.innerText)">0</div>
        <div class="copy-hint">点击复制</div>
      </div>
    </div>
  </div>

  <!-- 时间 → 时间戳 -->
  <div class="convert-card">
    <h2><span class="icon"></span>时间 → 时间戳</h2>
    <div class="input-group">
      <input type="text" id="timeInput" placeholder="输入时间，如 2026-07-23 14:30:00" />
      <button class="btn" onclick="timeToTimestamp()">转换</button>
    </div>
    <div class="quick-btns">
      <button class="quick-btn" onclick="setTimeNow()">填入当前时间</button>
      <button class="quick-btn" onclick="setTimeToday()">今天 00:00:00</button>
      <button class="quick-btn" onclick="document.getElementById('timeInput').value='';document.getElementById('timeResult').innerHTML=emptyHtml()">清空</button>
    </div>
    <div class="result-area" id="timeResult">
      <div class="result-empty">输入时间后点击「转换」查看结果</div>
    </div>
  </div>

  <!-- 时间戳 → 时间 -->
  <div class="convert-card">
    <h2><span class="icon"></span>时间戳 → 时间</h2>
    <div class="input-group">
      <input type="text" id="tsInput" placeholder="输入时间戳，如 1753256400 或 1753256400000" />
      <button class="btn" onclick="timestampToTime()">转换</button>
    </div>
    <div class="quick-btns">
      <button class="quick-btn" onclick="setTsNow()">填入当前秒级</button>
      <button class="quick-btn" onclick="setTsMillisNow()">填入当前毫秒级</button>
      <button class="quick-btn" onclick="document.getElementById('tsInput').value='';document.getElementById('tsResult').innerHTML=emptyHtml()">清空</button>
    </div>
    <div class="result-area" id="tsResult">
      <div class="result-empty">输入时间戳后点击「转换」查看结果</div>
    </div>
  </div>

  <footer>
    点击任意数值即可复制到剪贴板 · 时区：浏览器本地时区 (UTC<span id="tzOffset"></span>)
  </footer>
</div>

<div class="toast" id="toast">已复制到剪贴板</div>

<script>
  // —— 实时时间更新 ——
  function pad(n) { return String(n).padStart(2, '0'); }

  function updateLive() {
    const now = new Date();
    const h = pad(now.getHours());
    const m = pad(now.getMinutes());
    const s = pad(now.getSeconds());
    document.getElementById('liveTime').textContent = `${h}:${m}:${s}`;

    const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
    const dateStr = `${now.getFullYear()}年${pad(now.getMonth()+1)}月${pad(now.getDate())}日 星期${weekDays[now.getDay()]}`;
    document.getElementById('liveDate').textContent = dateStr;

    document.getElementById('tsSeconds').textContent = Math.floor(now.getTime() / 1000);
    document.getElementById('tsMillis').textContent = now.getTime();
  }

  updateLive();
  setInterval(updateLive, 1000);

  // 时区偏移
  const tzMin = -new Date().getTimezoneOffset();
  const tzH = Math.floor(Math.abs(tzMin) / 60);
  const tzM = Math.abs(tzMin) % 60;
  const tzSign = tzMin >= 0 ? '+' : '-';
  document.getElementById('tzOffset').textContent = `${tzSign}${pad(tzH)}:${pad(tzM)}`;

  // —— 时间 → 时间戳 ——
  function timeToTimestamp() {
    const input = document.getElementById('timeInput').value.trim();
    if (!input) { showToast('请输入时间'); return; }

    // 尝试解析多种格式
    let date;
    // 纯数字视为时间戳
    if (/^\d+$/.test(input)) {
      date = new Date(parseInt(input));
    } else {
      // 支持 2026-07-23 14:30:00 / 2026/07/23 14:30:00 / 2026-07-23T14:30:00
      const normalized = input.replace(/-/g, '/').replace('T', ' ');
      date = new Date(normalized);
    }

    if (isNaN(date.getTime())) {
      showToast('时间格式无法解析');
      return;
    }

    const ms = date.getTime();
    const sec = Math.floor(ms / 1000);
    const iso = date.toISOString();

    document.getElementById('timeResult').innerHTML = `
      <div class="result-line">
        <span class="r-label">秒级 (10位)</span>
        <span class="r-value" onclick="copyText(this.innerText)">${sec}</span>
      </div>
      <div class="result-line">
        <span class="r-label">毫秒级 (13位)</span>
        <span class="r-value" onclick="copyText(this.innerText)">${ms}</span>
      </div>
      <div class="result-line">
        <span class="r-label">本地时间</span>
        <span class="r-value" onclick="copyText(this.innerText)">${formatLocal(date)}</span>
      </div>
      <div class="result-line">
        <span class="r-label">UTC 时间</span>
        <span class="r-value" onclick="copyText(this.innerText)">${iso.replace('T', ' ').replace(/\.\d+Z$/, ' Z')}</span>
      </div>
    `;
  }

  // —— 时间戳 → 时间 ——
  function timestampToTime() {
    const input = document.getElementById('tsInput').value.trim();
    if (!input) { showToast('请输入时间戳'); return; }

    let ts = parseInt(input);
    if (isNaN(ts)) { showToast('时间戳格式无效'); return; }

    // 自动补全：10位→秒，13位→毫秒，其他按位数判断
    let ms;
    if (input.length === 10) ms = ts * 1000;
    else if (input.length === 13) ms = ts;
    else if (input.length < 10) ms = ts * 1000;  // 短的当秒处理
    else ms = ts; // 长的当毫秒

    const date = new Date(ms);
    if (isNaN(date.getTime())) { showToast('时间戳无效'); return; }

    const sec = Math.floor(ms / 1000);
    const iso = date.toISOString();

    document.getElementById('tsResult').innerHTML = `
      <div class="result-line">
        <span class="r-label">本地时间</span>
        <span class="r-value" onclick="copyText(this.innerText)">${formatLocal(date)}</span>
      </div>
      <div class="result-line">
        <span class="r-label">UTC 时间</span>
        <span class="r-value" onclick="copyText(this.innerText)">${iso.replace('T', ' ').replace(/\.\d+Z$/, ' Z')}</span>
      </div>
      <div class="result-line">
        <span class="r-label">相对时间</span>
        <span class="r-value">${relativeTime(date)}</span>
      </div>
      <div class="result-line">
        <span class="r-label">秒级 (10位)</span>
        <span class="r-value" onclick="copyText(this.innerText)">${sec}</span>
      </div>
      <div class="result-line">
        <span class="r-label">毫秒级 (13位)</span>
        <span class="r-value" onclick="copyText(this.innerText)">${ms}</span>
      </div>
    `;
  }

  // —— 工具函数 ——
  function formatLocal(date) {
    return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
  }

  function relativeTime(date) {
    const diff = date.getTime() - Date.now();
    const absDiff = Math.abs(diff);
    const sign = diff > 0 ? '之后' : '之前';

    if (absDiff < 60000) return `${Math.floor(absDiff / 1000)}秒${sign}`;
    if (absDiff < 3600000) return `${Math.floor(absDiff / 60000)}分钟${sign}`;
    if (absDiff < 86400000) return `${Math.floor(absDiff / 3600000)}小时${sign}`;
    if (absDiff < 2592000000) return `${Math.floor(absDiff / 86400000)}天${sign}`;
    if (absDiff < 31536000000) return `${Math.floor(absDiff / 2592000000)}个月${sign}`;
    return `${Math.floor(absDiff / 31536000000)}年${sign}`;
  }

  function emptyHtml() {
    return '<div class="result-empty">输入后点击「转换」查看结果</div>';
  }

  // —— 快捷填充 ——
  function setTimeNow() {
    document.getElementById('timeInput').value = formatLocal(new Date());
    timeToTimestamp();
  }

  function setTimeToday() {
    const d = new Date();
    d.setHours(0, 0, 0, 0);
    document.getElementById('timeInput').value = formatLocal(d);
    timeToTimestamp();
  }

  function setTsNow() {
    document.getElementById('tsInput').value = Math.floor(Date.now() / 1000);
    timestampToTime();
  }

  function setTsMillisNow() {
    document.getElementById('tsInput').value = Date.now();
    timestampToTime();
  }

  // —— 复制 ——
  function copyText(text) {
    navigator.clipboard.writeText(text).then(() => {
      showToast('已复制: ' + (text.length > 30 ? text.slice(0, 30) + '...' : text));
    }).catch(() => {
      // fallback
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('已复制到剪贴板');
    });
  }

  // —— Toast ——
  let toastTimer;
  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
  }

  // —— 回车触发转换 ——
  document.getElementById('timeInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') timeToTimestamp();
  });
  document.getElementById('tsInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') timestampToTime();
  });
</script>
</body>
</html>
